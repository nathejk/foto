name: foto

# Dev stack for the Nathejk foto service — the entrypoint for photographs into
# the ecosystem (PRD 001).
#
# No `ui` service: foto is headless by decision (PRD 001 §7). The `api` container
# is browser-reachable because kamera POSTs its webhook to it from outside the
# compose network, which is what makes this different from other repos where the
# Go binary stays internal.
#
# Full `up` requires the org infra repo's external `traefik` and `jetstream`
# networks. Real secrets and per-developer overrides go in
# docker-compose.override.yml (gitignored) — never in this file.

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: base
    environment:
      PORT: "4000"
      ENV: development
      GOCACHE: /go/.cache/go-build
      DB_DSN: "foto:foto@tcp(db:3306)/foto?parseTime=true&multiStatements=true"
      JETSTREAM_DSN: "nats://jetstream:4222"
      BLOB_PATH: "/blobs"
      # The season, not the calendar year: shared-go's patrulje projection takes
      # `year` from the event subject, which stops matching the calendar year once
      # a season opens in the preceding one. Resolving a team number against the
      # wrong year finds nothing.
      EVENT_YEAR: "2026"
      # Shared secret kamera sends as X-Webhook-Secret. Empty disables the check —
      # OVERRIDE in docker-compose.override.yml.
      WEBHOOK_SECRET: ""
      # Hosts an imageUrl may be fetched from. The webhook carries a URL and this
      # service fetches it, so without an allowlist the ingest endpoint is an SSRF
      # proxy. It fails closed: empty refuses every photo.
      #
      # Every host kamera might serve photos from has to be here, or a perfectly
      # good URL is refused with host_not_allowed — the effective list is logged at
      # boot so it can be checked at a glance.
      PHOTO_HOSTS: "kamera.nathejk.dk,foto.nathejk.dk,kamera.local.nathejk.dk,foto.local.nathejk.dk"
      MAX_PHOTO_BYTES: "33554432"
      FETCH_TIMEOUT: "20s"
      # GO_BUILD_FLAGS: "-race"   # uncomment for the race detector
    volumes:
      - ./go:/app
      - api:/go
      # Sibling shared-go checkout, resolved via go/go.work so edits are picked up
      # live. Prod/CI build with GOWORK=off against the pin in go.mod.
      - ../shared-go:/shared-go
      # The blob store. This is the only state that cannot be rebuilt by replaying
      # the stream, which makes it the whole backup scope — and the one volume
      # `docker compose down -v` must not be run against casually.
      - blobs:/blobs
    networks:
      - local
      - traefik
      - jetstream
    depends_on:
      - db
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      # Plain HTTP: the only client is kamera's server-side webhook and internal
      # services, so there is no browser secure context to satisfy. Add the
      # redirect pattern if a UI ever consumes this directly.
      traefik.http.routers.foto.rule: Host(`foto.local.nathejk.dk`)
      # Required: the container listens on 4000, not Traefik's default 80.
      traefik.http.services.foto.loadbalancer.server.port: "4000"

  db:
    image: mariadb:10.8
    environment:
      MARIADB_ROOT_PASSWORD: secret
      MARIADB_DATABASE: foto
      MARIADB_USER: foto
      MARIADB_PASSWORD: foto
    volumes:
      - db:/var/lib/mysql
    networks:
      - local
    labels:
      # This Traefik has exposedByDefault=true, so internal-only services must
      # opt out explicitly.
      traefik.enable: "false"

  phpmyadmin:
    image: phpmyadmin
    environment:
      PMA_HOST: db
    networks:
      - local
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.foto-sql.rule: Host(`sql.foto.local.nathejk.dk`)
    depends_on:
      - db

networks:
  local:
  # External networks are owned by the org infra repo — never redefined here.
  traefik:
    external: true
  jetstream:
    external: true

volumes:
  api:
  db:
  blobs:
